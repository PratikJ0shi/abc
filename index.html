
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universal Video Downloader</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
}

h1 {
  font-size: 34px;
}

h1 span {
  color: #38bdf8;
}

.subtitle {
  color: #aab5c8;
}

.download-box {
  background: #172033;
  padding: 25px;
  border: 1px solid #29364d;
  border-radius: 18px;
  margin-top: 25px;
}

label {
  display: block;
  text-align: left;
  margin: 18px 0 8px;
  color: #cbd5e1;
  font-size: 14px;
}

input, select {
  width: 100%;
  padding: 15px;
  border-radius: 9px;
  border: 1px solid #475569;
  background: #0b1020;
  color: white;
  font-size: 15px;
}

select {
  cursor: pointer;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: 0;
  border-radius: 9px;
  background: #0284c7;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#status {
  margin-top: 18px;
  color: #7dd3fc;
  overflow-wrap: anywhere;
}

.note {
  color: #94a3b8;
  font-size: 12px;
  margin-top: 15px;
}

</style>
</head>

<body>

<div class="container">

<h1>Universal <span>Downloader</span></h1>

<p class="subtitle">
Select your preferred video quality
</p>

<div class="download-box">

<label>360p Video URL</label>
<input id="url360" type="url"
placeholder="Paste 360p video URL">

<label>480p Video URL</label>
<input id="url480" type="url"
placeholder="Paste 480p video URL">

<label>720p Video URL</label>
<input id="url720" type="url"
placeholder="Paste 720p video URL">

<label>1080p Video URL</label>
<input id="url1080" type="url"
placeholder="Paste 1080p video URL">

<label>Select Video Quality</label>

<select id="quality">
<option value="360">360p</option>
<option value="480">480p</option>
<option value="720" selected>720p</option>
<option value="1080">1080p</option>
</select>

<button id="downloadBtn" onclick="downloadVideo()">
Download Video
</button>

<div id="status" role="status"></div>

<p class="note">
Only use authorized video URLs. The selected quality
must have a corresponding source file.
</p>

</div>
</div>

<script>

const WORKER_URL =
"https://abc.connect-pratikjoshi.workers.dev";

async function downloadVideo() {

  const quality =
    document.getElementById("quality").value;

  const input =
    document.getElementById("url" + quality);

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("downloadBtn");

  try {

    if (!input.value.trim()) {
      throw new Error(
        "Selected quality URL is missing."
      );
    }

    const videoUrl = new URL(input.value);

    if (videoUrl.protocol !== "https:") {
      throw new Error("HTTPS URL required.");
    }

    status.textContent =
      "Connecting to video server...";

    button.disabled = true;

    const apiUrl =
      WORKER_URL +
      "/download?url=" +
      encodeURIComponent(videoUrl.href);

    const response = await fetch(apiUrl);

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || "Download failed");
    }

    const blob = await response.blob();

    const objectUrl =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href = objectUrl;
    link.download = "video-" + quality + "p.mp4";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
      URL.revokeObjectURL(objectUrl);
    }, 60000);

    status.textContent =
      quality + "p download started successfully!";

  } catch (error) {

    status.textContent =
      "Error: " + error.message;

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
