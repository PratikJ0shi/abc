
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Video Downloader</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 16px;
      background: #1d293b;
      text-align: center;
    }

    h1 { margin-top: 0; }

    input {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #526176;
      border-radius: 8px;
      background: #101827;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .video-item {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #526176;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .note {
      color: #b8c4d5;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Universal Video Downloader</h1>
    <p>Paste a video page URL below</p>

    <input
      id="videoUrl"
      type="url"
      placeholder="https://example.com/video"
    >

    <button id="analyzeBtn" onclick="analyzeVideo()">
      Analyze Video
    </button>

    <div id="status" role="status"></div>
    <div id="results"></div>

    <p class="note">
      Current test version supports only approved domains
      and direct video downloads. DRM, HLS and DASH are
      not supported.
    </p>
  </main>

  <script>
    const WORKER =
      "https://abc.connect-pratikjoshi.workers.dev";

    async function analyzeVideo() {
      const input = document.getElementById("videoUrl");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const button = document.getElementById("analyzeBtn");

      const value = input.value.trim();

      results.innerHTML = "";

      if (!value) {
        status.textContent = "Please enter a video URL.";
        return;
      }

      let parsed;

      try {
        parsed = new URL(value);
      } catch {
        status.textContent = "Invalid URL.";
        return;
      }

      if (parsed.protocol !== "https:") {
        status.textContent = "Only HTTPS URLs are supported.";
        return;
      }

      button.disabled = true;
      status.textContent = "Analyzing...";

      try {
        const endpoint =
          WORKER + "/analyze?url=" + encodeURIComponent(value);

        const response = await fetch(endpoint);
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Analysis failed.");
        }

        status.textContent =
          "Analysis complete. Found " + data.count + " video(s).";

        if (!data.videos.length) {
          status.textContent +=
            " No video source was found in the page HTML.";
        }

        data.videos.forEach((video, index) => {
          const item = document.createElement("div");
          item.className = "video-item";

          const heading = document.createElement("p");
          heading.textContent =
            "Video " + (index + 1) + " — " + video.type;

          const link = document.createElement("a");
          link.href =
            WORKER + "/download?url=" +
            encodeURIComponent(video.url);
          link.textContent = "Download video";
          link.style.color = "#7db3ff";
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          item.appendChild(heading);
          item.appendChild(link);
          results.appendChild(item);
        });

      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
