
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Video Downloader</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
}

.logo {
  font-size: 42px;
  margin-bottom: 10px;
}

h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

h1 span { color: #38bdf8; }

.subtitle {
  color: #aab5c8;
  margin-bottom: 35px;
}

.download-box {
  background: #172033;
  padding: 25px;
  border: 1px solid #29364d;
  border-radius: 18px;
}

input {
  width: 100%;
  padding: 17px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #0b1020;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus { border-color: #38bdf8; }

button {
  width: 100%;
  margin-top: 15px;
  padding: 17px;
  border: 0;
  border-radius: 10px;
  background: #0284c7;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #0369a1; }

button:disabled {
  opacity: .6;
  cursor: wait;
}

#status {
  margin-top: 18px;
  color: #7dd3fc;
  overflow-wrap: anywhere;
}

.features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 25px;
}

.feature {
  background: #172033;
  padding: 17px 8px;
  border-radius: 12px;
  color: #cbd5e1;
  font-size: 13px;
}

footer {
  color: #64748b;
  margin-top: 30px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">▶</div>

  <h1>Universal <span>Downloader</span></h1>

  <p class="subtitle">
    Download videos from supported direct video links.
  </p>

  <div class="download-box">

    <input
      type="url"
      id="videoUrl"
      placeholder="Paste your direct MP4 video URL..."
    >

    <button id="downloadBtn" onclick="downloadVideo()">
      Download Video
    </button>

    <div id="status" role="status"></div>

  </div>

  <div class="features">

    <div class="feature">
      <strong>MP4</strong>
      <p>Video files</p>
    </div>

    <div class="feature">
      <strong>Secure</strong>
      <p>Restricted hosts</p>
    </div>

    <div class="feature">
      <strong>Streaming</strong>
      <p>File delivery</p>
    </div>

  </div>

  <footer>
    Only download videos you own or are authorized to download.
  </footer>

</div>

<script>

const WORKER_URL =
"https://abc.connect-pratikjoshi.workers.dev";

async function downloadVideo() {

  const input = document.getElementById("videoUrl");
  const status = document.getElementById("status");
  const button = document.getElementById("downloadBtn");

  try {

    const url = new URL(input.value);

    if (url.protocol !== "https:") {
      throw new Error("HTTPS video URL required.");
    }

    status.textContent = "Checking video source...";
    button.disabled = true;

    const downloadUrl =
      WORKER_URL + "/download?url=" +
      encodeURIComponent(url.href);

    const response = await fetch(downloadUrl);

    if (!response.ok) {
      const data = await response.json();
      throw new Error(data.error || "Download failed");
    }

    const blob = await response.blob();

    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = objectUrl;
    link.download = "video.mp4";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);

    status.textContent = "Download started successfully!";

  } catch (error) {

    status.textContent = "Error: " + error.message;

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
